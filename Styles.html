<style>
:root {
  --bg: #f6f8fb;
  --bg-2: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-muted-2: #94a3b8;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #dbeafe;
  --primary-soft: #eff6ff;
  --success: #16a34a;
  --warning: #f59e0b;
  --danger: #dc2626;
  --purple: #a855f7;
  --teal: #14b8a6;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08);
  --shadow-lg: 0 20px 50px rgba(15,23,42,.18);
  --r-sm: 6px;
  --r: 8px;
  --r-lg: 12px;
  --gap: 12px;
  --row-pad: 8px 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body.dark {
  --bg: #0b1220;
  --bg-2: #0f172a;
  --surface: #111827;
  --surface-2: #1e293b;
  --border: #1f2937;
  --border-strong: #334155;
  --text: #e5e7eb;
  --text-muted: #94a3b8;
  --text-muted-2: #64748b;
  --primary: #3b82f6;
  --primary-dark: #2563eb;
  --primary-light: #1e3a8a;
  --primary-soft: #0c1a3e;
}

body[data-density="compacta"] { --gap: 6px; --row-pad: 4px 8px; font-size: 13px; }
body[data-density="comoda"] { --gap: 12px; --row-pad: 8px 12px; font-size: 14px; }
body[data-density="holgada"] { --gap: 18px; --row-pad: 12px 16px; font-size: 15px; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--primary); }

.hidden { display: none !important; }
.muted { color: var(--text-muted); }
.text-center { text-align: center; }

/* ===== Bootstrap skeleton ===== */
.bootstrap-skeleton { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 9999; }
.bootstrap-skeleton-inner { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Layout ===== */
.layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.sidebar-brand { padding: 18px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
.logo-badge { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #1e40af); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.sidebar-brand h1 { margin: 0; font-size: 14px; font-weight: 600; }
.sidebar-brand p { margin: 0; font-size: 11px; color: var(--text-muted); }
.sidebar-nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r); color: var(--text-muted); font-size: 14px; font-weight: 500; transition: background .12s, color .12s; text-align: left; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary-dark); }
body.dark .nav-item.active { background: var(--primary-light); color: #fff; }
.nav-item .ico { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item span { flex: 1; }
.nav-badge { background: var(--warning); color: white; font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; min-width: 20px; text-align: center; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }

.main-wrap { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.topbar-search { flex: 1; position: relative; max-width: 720px; }
.topbar-search .search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted-2); pointer-events: none; }
.topbar-search input { width: 100%; padding: 9px 36px 9px 38px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface-2); outline: none; transition: border-color .15s, box-shadow .15s; }
.topbar-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); background: var(--surface); }
.topbar-search .iconbtn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.topbar-actions { display: flex; gap: 4px; }
.iconbtn { padding: 8px; border-radius: var(--r); color: var(--text-muted); transition: background .12s, color .12s; }
.iconbtn:hover { background: var(--surface-2); color: var(--text); }
.iconbtn svg { width: 18px; height: 18px; }

.main { padding: 20px; max-width: 1280px; margin: 0 auto; width: 100%; flex: 1; }

.bottombar { display: none; }
.show-mobile { display: none !important; }

@media (max-width: 1023px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; top: 0; left: -260px; width: 260px; z-index: 100; transition: left .25s; }
  .sidebar.open { left: 0; box-shadow: var(--shadow-lg); }
  .show-mobile { display: inline-flex !important; }
  .bottombar { display: flex; position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); justify-content: space-around; padding: 6px 4px; z-index: 10; }
  .bb-item { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 6px 10px; border-radius: var(--r); color: var(--text-muted); font-size: 11px; }
  .bb-item.active { color: var(--primary); }
  .bb-item .ico { width: 18px; height: 18px; }
  .main { padding: 14px; }
}

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r); font-size: 13px; font-weight: 500; transition: background .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { background: #15803d; }
.btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
.btn-danger:hover { background: #fecaca; }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
body.dark .btn-secondary { background: var(--surface-2); border-color: var(--border); }
body.dark .btn-danger { background: #3b1212; color: #fecaca; border-color: #7f1d1d; }

/* ===== Cards & sections ===== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-sm); }
.card-title { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--text); }
.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; margin-bottom: var(--gap); }
.section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.section-title { margin: 0; font-size: 14px; font-weight: 600; }
.section-actions { margin-left: auto; display: flex; gap: 6px; }

/* ===== Inputs ===== */
.input, .select, .textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.textarea { resize: vertical; min-height: 64px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field-label { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.row-fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (max-width: 640px) { .row-fields { grid-template-columns: 1fr; } }

/* ===== Badges ===== */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid transparent; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.badge-default { background: var(--surface-2); color: var(--text-muted); border-color: var(--border); }
.badge-success { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
.badge-warning { background: #fffbeb; color: #b45309; border-color: #fde68a; }
.badge-danger { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge-info { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge-purple { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
.badge-teal { background: #f0fdfa; color: #0f766e; border-color: #99f6e4; }
body.dark .badge-default { background: var(--surface-2); color: var(--text-muted); }
body.dark .badge-success { background: #052e1a; color: #86efac; }
body.dark .badge-warning { background: #422006; color: #fcd34d; }
body.dark .badge-danger { background: #3b1212; color: #fca5a5; }
body.dark .badge-info { background: #0c1a3e; color: #93c5fd; }

.codigo { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: white; }
.codigo-X { background: #3b82f6; }
.codigo-R { background: #f97316; }
.codigo-RA { background: #a855f7; }
.codigo-PM { background: #14b8a6; }
.codigo-Si { background: #22c55e; }
.codigo-Si-RA { background: #16a34a; }
.codigo-FS { background: #eab308; color: black; }
.codigo-Baja { background: #374151; }
.codigo-NU { background: #ec4899; }
.codigo-C1, .codigo-C2, .codigo-C3, .codigo-C4, .codigo-C5, .codigo-C6, .codigo-C7, .codigo-C8 { background: #f87171; }

/* ===== KPI cards ===== */
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .kpi-grid { grid-template-columns: 1fr; } }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; cursor: pointer; transition: box-shadow .15s, transform .05s; position: relative; overflow: hidden; }
.kpi-card:hover { box-shadow: var(--shadow-md); }
.kpi-card:active { transform: translateY(1px); }
.kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.kpi-value { font-size: 36px; font-weight: 700; line-height: 1.1; margin: 4px 0; }
.kpi-sub { font-size: 12px; color: var(--text-muted); }
.kpi-card.kpi-primary { border-left: 4px solid var(--primary); }
.kpi-card.kpi-success { border-left: 4px solid var(--success); }
.kpi-card.kpi-warning { border-left: 4px solid var(--warning); }

.kpi-grid-sm { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
@media (max-width: 900px) { .kpi-grid-sm { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .kpi-grid-sm { grid-template-columns: 1fr; } }
.kpi-card-sm { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; cursor: pointer; transition: box-shadow .15s; }
.kpi-card-sm:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }
.kpi-card-sm .kpi-label { font-size: 11px; }
.kpi-card-sm .kpi-value { font-size: 22px; }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; padding: 10px 12px; background: var(--surface-2); color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
.table th.sortable { cursor: pointer; user-select: none; }
.table th.sortable:hover { color: var(--text); }
.table td { padding: var(--row-pad); border-bottom: 1px solid var(--border); }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: var(--surface-2); }
.table .num { text-align: right; }
.table .row-clickable { cursor: pointer; }

/* ===== Search results list ===== */
.results { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.result-item { width: 100%; padding: 12px 16px; background: transparent; border-bottom: 1px solid var(--border); text-align: left; display: flex; align-items: center; gap: 16px; transition: background .1s; }
.result-item:last-child { border-bottom: none; }
.result-item:hover { background: var(--surface-2); }
.result-name { font-weight: 500; }
.result-sub { color: var(--text-muted); font-size: 13px; }
.result-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.result-meta b { color: var(--text); }
.hl { background: #fef08a; color: #713f12; padding: 0 2px; border-radius: 2px; }
body.dark .hl { background: #422006; color: #fde68a; }

/* ===== Filters bar ===== */
.filters { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filters .select, .filters .input { padding: 7px 10px; min-width: 140px; }
.filter-count { margin-left: auto; font-size: 12px; color: var(--text-muted); }
.btn-clear { color: var(--primary); background: transparent; padding: 4px 8px; font-size: 12px; }
.btn-clear:hover { text-decoration: underline; }
.toggle-group { display: inline-flex; background: var(--surface-2); border-radius: var(--r); padding: 2px; }
.toggle-btn { padding: 5px 12px; border-radius: var(--r-sm); font-size: 13px; color: var(--text-muted); }
.toggle-btn.active { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: var(--shadow-sm); }

/* ===== Empty state ===== */
.empty { text-align: center; padding: 64px 20px; }
.empty-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
.empty h3 { margin: 0 0 6px; font-size: 18px; }
.empty p { color: var(--text-muted); max-width: 480px; margin: 0 auto 18px; }

/* ===== Modal ===== */
.modal-host { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); }
.modal { position: relative; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 900px; margin: 32px auto; overflow: hidden; }
.modal-sm { max-width: 560px; }
.modal-header { padding: 16px 24px; background: linear-gradient(135deg, #0f172a, #1e293b); color: white; }
.modal-id { font-size: 11px; color: #cbd5e1; margin-bottom: 4px; }
.modal-title { font-size: 18px; font-weight: 600; margin: 0; }
.modal-subtitle { font-size: 13px; color: #cbd5e1; margin: 2px 0 8px; }
.modal-close { position: absolute; top: 12px; right: 12px; padding: 6px; color: white; border-radius: 6px; background: transparent; }
.modal-close:hover { background: rgba(255,255,255,.12); }
.modal-body { padding: 20px 24px; }
.modal-body-scroll { max-height: 70vh; overflow-y: auto; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); }
.modal-header-sm { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header-sm h3 { margin: 0; font-size: 15px; font-weight: 600; }
.modal-close-sm { padding: 6px; color: var(--text-muted); border-radius: 6px; }
.modal-close-sm:hover { background: var(--surface-2); color: var(--text); }

/* ===== Datos grid ===== */
.datos-grid { padding: 16px 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; border-bottom: 1px solid var(--border); }
.dato-label { font-size: 11px; color: var(--text-muted); }
.dato-value { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 700px) { .datos-grid { grid-template-columns: repeat(2, 1fr); } }

/* ===== MP table ===== */
.mp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.mp-table th { padding: 6px; text-align: center; font-weight: 500; color: var(--text-muted); min-width: 44px; }
.mp-table th:first-child { text-align: left; width: 100px; }
.mp-table td { padding: 8px 4px; text-align: center; border-top: 1px solid var(--border); }
.mp-table td:first-child { text-align: left; font-weight: 500; padding-left: 8px; }
.mp-empty { color: var(--text-muted-2); }

/* ===== Pendiente cards ===== */
.pendiente { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r); margin-bottom: 8px; }
.pendiente.cerrado { background: var(--surface-2); opacity: .65; }
.pendiente.cerrado .pendiente-desc { text-decoration: line-through; }
.pendiente.vencido { border-color: #fca5a5; }
.pendiente-main { padding: 12px; display: flex; align-items: flex-start; gap: 12px; }
.pendiente-desc { font-weight: 500; }
.pendiente-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 12px; }
.pendiente-meta b { color: var(--text); }
.checkbox { width: 16px; height: 16px; margin-top: 2px; cursor: pointer; }
.flex-1 { flex: 1; min-width: 0; }
.pendiente-expand { padding: 12px; border-top: 1px solid var(--border); background: var(--surface-2); }
.pendiente-toggle { padding: 4px; color: var(--text-muted); }

/* ===== Alerts ===== */
.alert { padding: 10px 12px; border-radius: var(--r); font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; align-items: flex-start; }
.alert-info { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.alert-warn { background: #fff7ed; color: #9a3412; border: 1px solid #fdba74; }
.alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
body.dark .alert-info { background: #422006; color: #fcd34d; border-color: #78350f; }
body.dark .alert-warn { background: #3b1f06; color: #fdba74; border-color: #92400e; }
body.dark .alert-error { background: #3b1212; color: #fca5a5; border-color: #7f1d1d; }
body.dark .alert-success { background: #052e1a; color: #86efac; border-color: #166534; }

/* ===== Toasts ===== */
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
.toast { padding: 10px 14px; border-radius: var(--r); background: #0f172a; color: white; box-shadow: var(--shadow-md); font-size: 13px; opacity: 0; animation: toastIn .25s forwards; min-width: 220px; }
.toast.success { background: #166534; }
.toast.error { background: #991b1b; }
.toast.warn { background: #b45309; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Skeleton ===== */
.skel { background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: skel 1.2s linear infinite; border-radius: 4px; }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.skel-row { height: 44px; margin: 8px 0; border-radius: var(--r); }
.skel-card { height: 100px; border-radius: var(--r-lg); }

/* ===== Vista header ===== */
.vista-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.vista-title { margin: 0; font-size: 22px; font-weight: 600; }
.vista-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== Plantilla cards ===== */
.plantilla-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 800px) { .plantilla-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 540px) { .plantilla-grid { grid-template-columns: repeat(2, 1fr); } }
.plantilla-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; text-align: left; cursor: pointer; transition: all .15s; }
.plantilla-card:hover { box-shadow: var(--shadow-md); }
.plantilla-card.actual { box-shadow: 0 0 0 2px var(--primary); }

/* ===== Chart ===== */
.chart-host { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; margin-bottom: 16px; }
.chart-svg { width: 100%; height: 220px; }
.chart-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }

/* ===== Pills (tab toggles inside vistas) ===== */
